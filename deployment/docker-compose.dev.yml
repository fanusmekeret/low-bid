# Local MySQL 8 + Redis for development and integration tests.
# Start:  docker compose -f deployment/docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
      MYSQL_DATABASE: lowbid
      MYSQL_USER: lowbid
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
