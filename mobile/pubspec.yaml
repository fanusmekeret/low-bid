name: lowbid
description: LOW BID — Ethiopian online auction marketplace (buyers and sellers)
publish_to: none
version: 0.7.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  # Networking and live updates
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # UI and device
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  # Version follows Flutter's pinned intl (used by flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
