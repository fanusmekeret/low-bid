# Local development services. Production runs these on the VPS bound to localhost.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lowbid
      MYSQL_USER: lowbid
      MYSQL_PASSWORD: lowbid
    ports: ["3306:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin=binlog"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql_data:
